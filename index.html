<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신규 개원 찾기</title>
<meta name="description" content="심평원 공공데이터로 최근 새로 문 연 병원·의원을 지역별로 찾아요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --ink: #16202a; --sub: #5f6b77; --line: #e3e8ee;
    --brand: #0f766e; --brand-soft: #e6f4f2; --warn: #b45309; --warn-soft: #fef3e2;
    --new: #dc2626; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1418; --card: #172027; --ink: #e8eef2; --sub: #93a1ad; --line: #26323b;
      --brand: #2dd4bf; --brand-soft: #123532; --warn: #fbbf24; --warn-soft: #3a2c10; --new: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 48px; }
  header { padding: 28px 0 18px; }
  header h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.02em; }
  header p { margin: 6px 0 0; color: var(--sub); font-size: 0.92rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .controls { display: grid; gap: 14px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label.f { display: grid; gap: 6px; font-size: 0.8rem; color: var(--sub); font-weight: 600; }
  select, input[type=search] { width: 100%; font: inherit; font-size: 1rem; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 0.85rem; padding: 7px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--sub); }
  .chip.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 700; }
  .go { font: inherit; font-weight: 700; font-size: 1rem; border: 0; border-radius: 10px; padding: 13px;
    background: var(--brand); color: #fff; cursor: pointer; }
  @media (prefers-color-scheme: dark) { .go { color: #062a26; } }
  .go:disabled { opacity: 0.6; cursor: wait; }
  .summary { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    margin: 22px 2px 10px; }
  .summary b { font-size: 1.15rem; }
  .summary .meta { color: var(--sub); font-size: 0.8rem; }
  .tools { display: flex; gap: 8px; margin-bottom: 10px; }
  .tools input { flex: 1; }
  .ghost { font: inherit; font-size: 0.85rem; padding: 0 14px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); white-space: nowrap; }
  .sggu { margin-bottom: 12px; }
  .list { display: grid; gap: 10px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .item .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .item h3 { margin: 0; font-size: 1.05rem; letter-spacing: -0.01em; }
  .badge { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 6px;
    background: var(--brand-soft); color: var(--brand); margin-right: 4px; }
  .badge.fresh { background: var(--warn-soft); color: var(--warn); }
  .date { text-align: right; flex-shrink: 0; }
  .date b { display: block; font-size: 0.95rem; }
  .date span { font-size: 0.75rem; color: var(--sub); }
  .date .n { color: var(--new); font-weight: 700; }
  .info { margin: 8px 0 0; color: var(--sub); font-size: 0.85rem; line-height: 1.5; }
  .acts { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .acts a { font-size: 0.82rem; font-weight: 600; text-decoration: none; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; background: var(--bg); }
  .state { text-align: center; color: var(--sub); padding: 36px 16px; line-height: 1.7; }
  .state.err { color: var(--warn); }
  .spin { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--brand);
    border-radius: 50%; margin: 0 auto 12px; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .more { display: block; width: 100%; margin-top: 12px; padding: 12px; }
  footer { margin-top: 28px; color: var(--sub); font-size: 0.76rem; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏥 신규 개원 찾기</h1>
    <p>새로 문 연 병원·의원을 경쟁사보다 먼저 확인하세요</p>
  </header>

  <section class="card controls">
    <div class="row">
      <label class="f">지역
        <select id="sido"></select>
      </label>
      <label class="f">기간
        <select id="months">
          <option value="1">최근 1개월</option>
          <option value="3" selected>최근 3개월</option>
          <option value="6">최근 6개월</option>
          <option value="12">최근 12개월</option>
        </select>
      </label>
    </div>
    <div class="f" style="display:grid;gap:6px;font-size:.8rem;color:var(--sub);font-weight:600">기관 종류
      <div class="chips" id="types"></div>
    </div>
    <button class="go" id="go">찾기</button>
  </section>

  <div id="out"></div>

  <footer>
    출처: 건강보험심사평가원 병원정보서비스(공공데이터포털) · 개설일자 기준<br>
    심평원 등록 정보라 실제 개원일과 며칠 차이가 날 수 있어요. 방문 전 전화로 확인해 주세요.
  </footer>
</div>

<script>
const SIDO = [["230000","대구"],["370000","경북"],["110000","서울"],["210000","부산"],["380000","경남"],["220000","인천"],["310000","경기"],["250000","대전"],["260000","울산"],["360000","전남·광주"],["320000","강원"],["330000","충북"],["340000","충남"],["350000","전북"],["390000","제주"],["410000","세종"]];
const TYPES = [["31","의원"],["21","병원"],["11","종합병원"],["01","상급종합"],["28","요양병원"],["29","정신병원"],["51","치과의원"],["41","치과병원"],["93","한의원"],["92","한방병원"]];
const PREF_KEY = "ncf_pref_v1", CACHE_KEY = "ncf_cache_v1", CACHE_MS = 6 * 3600e3, PAGE = 30;
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

let pref = store.get(PREF_KEY) || { sido: "230000", months: "3", types: ["31", "21", "11", "28"] };
let data = null, query = "", sgguSel = "", shown = PAGE;

// ── 선택 영역 ──
$("sido").innerHTML = SIDO.map(([c, n]) => `<option value="${c}">${n}</option>`).join("");
$("sido").value = pref.sido; $("months").value = pref.months;
function drawTypes() {
  $("types").innerHTML = TYPES.map(([c, n]) =>
    `<button type="button" class="chip ${pref.types.includes(c) ? "on" : ""}" data-c="${c}">${n}</button>`).join("");
}
drawTypes();
$("types").addEventListener("click", (e) => {
  const c = e.target.dataset?.c; if (!c) return;
  pref.types = pref.types.includes(c) ? pref.types.filter((x) => x !== c) : [...pref.types, c];
  drawTypes();
});
$("go").addEventListener("click", () => load(true));

// ── 날짜 도우미 ──
const ymd = (s) => s && s.length === 8 ? `${s.slice(0, 4)}.${+s.slice(4, 6)}.${+s.slice(6)}` : "-";
function daysSince(s) {
  if (!s || s.length !== 8) return null;
  const d = new Date(`${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6)}T00:00:00+09:00`);
  return Math.floor((Date.now() - d) / 864e5);
}

// ── 불러오기 ──
async function load(force) {
  if (!pref.types.length) { $("out").innerHTML = `<div class="state err">기관 종류를 하나 이상 골라 주세요.</div>`; return; }
  pref.sido = $("sido").value; pref.months = $("months").value; store.set(PREF_KEY, pref);
  const qs = `sido=${pref.sido}&months=${pref.months}&types=${[...pref.types].sort().join(",")}`;
  const cache = store.get(CACHE_KEY);
  if (!force && cache && cache.qs === qs && Date.now() - cache.t < CACHE_MS) { data = cache.data; return render(true); }

  $("go").disabled = true;
  $("out").innerHTML = `<div class="state"><div class="spin"></div>심평원 병원 목록을 확인하는 중이에요<br><small>지역이 넓으면 20~30초 걸릴 수 있어요</small></div>`;
  try {
    const r = await fetch(`/api/new?${qs}`);
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(d.message || d.error || `오류 ${r.status}`), { code: d.error });
    data = d; store.set(CACHE_KEY, { qs, t: Date.now(), data: d });
    query = ""; sgguSel = ""; render(false);
  } catch (e) {
    $("out").innerHTML = e.code === "NO_KEY"
      ? `<div class="state err">아직 공공데이터 인증키가 연결되지 않았어요.<br><small>Vercel 프로젝트 설정 → Environment Variables에 <b>HIRA_KEY</b>를 넣고 다시 배포해 주세요.</small></div>`
      : `<div class="state err">목록을 불러오지 못했어요.<br><small>${esc(e.message)}</small><br><button class="ghost more" onclick="load(true)">다시 시도</button></div>`;
  } finally { $("go").disabled = false; }
}

// ── 결과 그리기 ──
function filtered() {
  const q = query.trim().toLowerCase();
  return data.items.filter((h) =>
    (!sgguSel || h.sggu === sgguSel) &&
    (!q || `${h.name} ${h.addr} ${h.sggu} ${h.type}`.toLowerCase().includes(q)));
}
function render(fromCache) {
  shown = PAGE;
  const sgguCount = {};
  data.items.forEach((h) => { sgguCount[h.sggu] = (sgguCount[h.sggu] || 0) + 1; });
  const sggus = Object.entries(sgguCount).sort((a, b) => b[1] - a[1]);
  $("out").innerHTML = `
    <div class="summary">
      <div><b>${esc(data.sidoName)} · 최근 ${data.months}개월 <span style="color:var(--brand)">${data.count}곳</span></b></div>
      <div class="meta">${ymd(data.since)} 이후 개설 · ${fromCache ? "저장된 결과" : "방금 확인"}</div>
    </div>
    <div class="tools">
      <input type="search" id="q" placeholder="이름·주소로 찾기" value="${esc(query)}">
      <button class="ghost" id="csv">엑셀 저장</button>
    </div>
    ${sggus.length > 1 ? `<div class="chips sggu" id="sg">
      <button class="chip ${!sgguSel ? "on" : ""}" data-s="">전체 ${data.count}</button>
      ${sggus.map(([s, n]) => `<button class="chip ${sgguSel === s ? "on" : ""}" data-s="${esc(s)}">${esc(s)} ${n}</button>`).join("")}
    </div>` : ""}
    <div class="list" id="list"></div>`;
  $("q").addEventListener("input", (e) => { query = e.target.value; shown = PAGE; drawList(); });
  $("csv").addEventListener("click", downloadCsv);
  $("sg")?.addEventListener("click", (e) => {
    if (e.target.dataset?.s === undefined) return;
    sgguSel = e.target.dataset.s; shown = PAGE;
    document.querySelectorAll("#sg .chip").forEach((b) => b.classList.toggle("on", b.dataset.s === sgguSel));
    drawList();
  });
  drawList();
}
function drawList() {
  const rows = filtered();
  if (!rows.length) {
    $("list").innerHTML = `<div class="state">${data.count ? "조건에 맞는 곳이 없어요." : "이 기간에 새로 연 곳이 없어요.<br><small>기간을 늘리거나 다른 지역을 골라 보세요.</small>"}</div>`;
    return;
  }
  $("list").innerHTML = rows.slice(0, shown).map(card).join("") +
    (rows.length > shown ? `<button class="ghost more" id="more">${rows.length - shown}곳 더 보기</button>` : "");
  $("more")?.addEventListener("click", () => { shown += PAGE; drawList(); });
}
function card(h) {
  const d = daysSince(h.open);
  const tel = h.tel ? `<a href="tel:${esc(h.tel.replace(/[^0-9]/g, ""))}">📞 전화</a>` : "";
  const map = h.x && h.y
    ? `<a href="https://map.kakao.com/link/map/${encodeURIComponent(h.name)},${h.y},${h.x}" target="_blank" rel="noopener">🗺️ 지도</a>`
    : `<a href="https://map.kakao.com/?q=${encodeURIComponent(h.name + " " + h.sggu)}" target="_blank" rel="noopener">🗺️ 지도</a>`;
  const web = h.url ? `<a href="${esc(/^https?:/.test(h.url) ? h.url : "http://" + h.url)}" target="_blank" rel="noopener">🌐 홈페이지</a>` : "";
  const naver = `<a href="https://search.naver.com/search.naver?query=${encodeURIComponent(h.name + " " + h.sggu)}" target="_blank" rel="noopener">🔎 검색</a>`;
  return `<article class="item">
    <div class="top">
      <div>
        <span class="badge">${esc(h.type)}</span>${d !== null && d <= 14 ? `<span class="badge fresh">NEW</span>` : ""}
        <h3 style="margin-top:6px">${esc(h.name)}</h3>
      </div>
      <div class="date"><b>${ymd(h.open)}</b><span>${d === null ? "" : d < 0 ? "개원 예정" : d === 0 ? `<span class="n">오늘 개원</span>` : `개원 ${d}일째`}</span></div>
    </div>
    <p class="info">${esc(h.addr)}${h.docs ? `<br>의사 ${h.docs}명` : ""}${h.tel ? ` · ${esc(h.tel)}` : ""}</p>
    <div class="acts">${tel}${map}${naver}${web}</div>
  </article>`;
}

// ── 엑셀(CSV) 저장 ──
function downloadCsv() {
  const head = ["개설일자", "기관명", "종류", "시군구", "주소", "전화", "의사수", "홈페이지"];
  const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [head, ...filtered().map((h) => [ymd(h.open), h.name, h.type, h.sggu, h.addr, h.tel, h.docs || "", h.url])]
    .map((r) => r.map(cell).join(","));
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `신규개원_${data.sidoName}_${data.months}개월_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

load(false);
</script>
</body>
</html>
